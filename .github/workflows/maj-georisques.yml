name: Mise à jour Géorisques

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours vers 6h-7h (heure de Paris)
  workflow_dispatch:         # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger GASPAR et reconstruire les données
        run: python scripts/build_data.py
      - name: Publier si quelque chose a changé
        run: |
          git config user.name "lezarde-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/secheresse.json
          git diff --cached --quiet || (git commit -m "Données Géorisques du $(date +%F)" && git push)
